signatures:
  - id: SIG-DS-SQLITE
    component: "ds:local/sqlite/default"
    role: primary-db
    status: confirmed
    when:
      any:
        - {dependency: better-sqlite3}
        - {dependency: sqlite3}
        - {code: {glob: "**/*.py", regex: "sqlite3\\.connect\\("}}
        - {code: {glob: "**/schema.prisma", regex: "provider\\s*=\\s*\"sqlite\""}}
        - {code: {glob: "**/settings*.py", regex: "django\\.db\\.backends\\.sqlite3"}}
        - {dependency: "org.xerial:sqlite-jdbc"}
        - {code: {glob: "**/application*.yml", regex: "jdbc:sqlite:"}}
        - {code: {glob: "**/application*.yaml", regex: "jdbc:sqlite:"}}
        - {code: {glob: "**/application*.properties", regex: "jdbc:sqlite:"}}
    refine:
      - component: "ds:local/sqlite/wal"
        when:
          any:
            - {code: {glob: "**/*.py", regex: "journal_mode\\s*=\\s*WAL", flags: i}}
            - {code: {glob: "**/*.ts", regex: "journal_mode\\s*=\\s*WAL", flags: i}}
            - {code: {glob: "**/*.js", regex: "journal_mode\\s*=\\s*WAL", flags: i}}
  - id: SIG-DS-POSTGRES
    component: "ds:unspecified/postgresql/default"
    role: primary-db
    status: confirmed
    when:
      any:
        - {dependency: pg}
        - {dependency: postgres}
        - {dependency: psycopg}
        - {dependency: psycopg2}
        - {dependency: psycopg2-binary}
        - {dependency: asyncpg}
        - {code: {glob: "**/schema.prisma", regex: "provider\\s*=\\s*\"postgresql\""}}
        - {code: {glob: "**/settings*.py", regex: "django\\.db\\.backends\\.postgresql"}}
        - {dependency: "org.postgresql:postgresql"}
        - {code: {glob: "**/application*.yml", regex: "jdbc:postgresql://"}}
        - {code: {glob: "**/application*.yaml", regex: "jdbc:postgresql://"}}
        - {code: {glob: "**/application*.properties", regex: "jdbc:postgresql://"}}
        # 접속 URL(`postgresql+asyncpg://` 같은 드라이버 표기 포함)
        - {code: {glob: "**/*.py", regex: "postgres(?:ql)?(?:\\+\\w+)?://"}}
        - {code: {glob: "**/*.js", regex: "postgres(?:ql)?(?:\\+\\w+)?://"}}
        - {code: {glob: "**/*.ts", regex: "postgres(?:ql)?(?:\\+\\w+)?://"}}
        - {code: {glob: "**/*.yml", regex: "postgres(?:ql)?(?:\\+\\w+)?://"}}
        - {code: {glob: "**/*.yaml", regex: "postgres(?:ql)?(?:\\+\\w+)?://"}}
        - {code: {glob: "**/*env.example", regex: "postgres(?:ql)?(?:\\+\\w+)?://"}}
        - {code: {glob: "**/*.toml", regex: "postgres(?:ql)?(?:\\+\\w+)?://"}}
  - id: SIG-DS-MYSQL
    component: "ds:unspecified/mysql/default"
    role: primary-db
    status: confirmed
    when:
      any:
        - {dependency: mysql2}
        - {dependency: mysqlclient}
        - {dependency: pymysql}
        - {code: {glob: "**/schema.prisma", regex: "provider\\s*=\\s*\"mysql\""}}
        # MariaDB는 MySQL 호환이라 MySQL 구성 요소로 본다
        - {dependency: "com.mysql:mysql-connector-j"}
        - {dependency: "mysql:mysql-connector-java"}
        - {dependency: "org.mariadb.jdbc:mariadb-java-client"}
        - {code: {glob: "**/application*.yml", regex: "jdbc:(?:mysql|mariadb)://"}}
        - {code: {glob: "**/application*.yaml", regex: "jdbc:(?:mysql|mariadb)://"}}
        - {code: {glob: "**/application*.properties", regex: "jdbc:(?:mysql|mariadb)://"}}
  - id: SIG-DS-MONGO
    component: "ds:unspecified/mongodb/default"
    role: primary-db
    status: confirmed
    when:
      any:
        - {dependency: mongodb}
        - {dependency: mongoose}
        - {dependency: pymongo}
        - {dependency: motor}
  # 의존성만으로는 인증·스토리지만 쓰는지 알 수 없으므로 후보다. 테이블·RPC 호출이나 Supabase DB 접속 URL이 있어야 확정
  - id: SIG-DS-SUPABASE
    component: "ds:supabase/postgres/unspecified-plan"
    role: primary-db
    status: candidate
    when:
      any:
        - {dependency: "@supabase/supabase-js"}
        - {dependency: supabase}
    refine:
      - component: "ds:supabase/postgres/unspecified-plan"
        status: confirmed
        when:
          any:
            # 받는 쪽 이름에 supabase가 든 `.from('t')`·`.rpc('f')`(줄바꿈 체인 포함, `.storage.from`은 아니다)
            - {code: {glob: "**/*.ts", regex: "\\b\\w*supabase\\w*(?:\\(\\))?\\s*\\.(?:from|rpc)\\(\\s*['\"`]", flags: i, multiline: true}}
            - {code: {glob: "**/*.tsx", regex: "\\b\\w*supabase\\w*(?:\\(\\))?\\s*\\.(?:from|rpc)\\(\\s*['\"`]", flags: i, multiline: true}}
            - {code: {glob: "**/*.js", regex: "\\b\\w*supabase\\w*(?:\\(\\))?\\s*\\.(?:from|rpc)\\(\\s*['\"`]", flags: i, multiline: true}}
            - {code: {glob: "**/*.jsx", regex: "\\b\\w*supabase\\w*(?:\\(\\))?\\s*\\.(?:from|rpc)\\(\\s*['\"`]", flags: i, multiline: true}}
            - {code: {glob: "**/*.py", regex: "\\b\\w*supabase\\w*(?:\\(\\))?\\s*\\.(?:from_|rpc)\\(\\s*['\"]", flags: i, multiline: true}}
            - {code: {glob: "**/*.py", regex: "postgres(?:ql)?://[^\\s'\"]*\\.supabase\\.(?:co|com)"}}
            - {code: {glob: "**/*.ts", regex: "postgres(?:ql)?://[^\\s'\"`]*\\.supabase\\.(?:co|com)"}}
            - {code: {glob: "**/*.js", regex: "postgres(?:ql)?://[^\\s'\"`]*\\.supabase\\.(?:co|com)"}}
            - {code: {glob: "**/*env.example", regex: "postgres(?:ql)?://\\S*\\.supabase\\.(?:co|com)"}}
            - {code: {glob: "**/*.toml", regex: "postgres(?:ql)?://[^\\s'\"]*\\.supabase\\.(?:co|com)"}}
  - id: SIG-DS-FIRESTORE
    component: "ds:firebase/firestore/standard"
    role: primary-db
    status: confirmed
    when:
      any:
        - {code: {glob: "**/*.ts", regex: "getFirestore\\("}}
        - {code: {glob: "**/*.js", regex: "getFirestore\\("}}
        - {code: {glob: "**/*.py", regex: "firestore\\.client\\("}}
