# 추천 후보 구성 요소의 능력 값(계획 2 MVP, 고정 형식).
#
# 값 규칙(README §3, docs/research/source-audit.md):
# - 값은 docs/research/capabilities/*.md 의 한 줄에서만 가져온다. 그 줄의 인용이 적격(A) 출처이고
#   ` ⚠️근거없음`·` ⚠️출처부적격` 표시가 없어야 한다.
# - source.quote 는 그 줄(doc:line)에 그대로 있는 문구다. 가능하면 그 값을 직접 뒷받침하는 공식 문서 인용을 쓴다.
#   source.url 은 그 줄이 인용한 URL이다([PL] 표기는 그 문서 머리말의 AWS Price List 오퍼 파일).
# - 조사 문서에 적격 인용으로 적힌 값이 없거나, 줄의 인용이 그 값을 뒷받침하지 않으면 키를 생략한다(엔진은 unknown).
#   추론·반올림·외부 지식은 쓰지 않는다.
# - COST.monthly_floor_usd 는 조사 문서가 서울 리전 최소 월 비용을 적격 인용과 함께 적은 경우에만 둔다.
# - COST.monthly_pinned_usd 는 인스턴스 1개를 상시 둘 때의 서울 월 비용(조사 문서 줄에 그 값이 있을 때만).
#   scale-to-zero 플랫폼에서 인스턴스 고정 설정(CP.single_instance_config·CP.always_on_config)이 필요한 후보는
#   바닥 비용 대신 이 값을 쓰고, 키가 없으면 비용을 모른다(null).
# - CP.always_on_config 는 상시 실행이 아닌 플랫폼에서 워커를 붙잡아 두는 설정. 요청 기반 과금 Cloud Run은 요청 밖
#   CPU가 없어(05:134) 두지 않는다.
# - ops_burden 은 조사 문서의 해당 줄이 모두 ` ⚠️근거없음`(평가)이라 어느 구성 요소에도 두지 않았다.
#
# 생략한 키와 이유(조사 문서 줄 번호, 2026-10-02 공식 문서 재조사 후):
# - Lambda: CP.websocket(05:493 '미확인'. Function URL 문서는 웹소켓을 언급하지 않고, WebSocket API는 API Gateway 기능으로만 적혀 있음),
#   CP.scale_to_zero(공식 문서에 명시 문장 없음. "might completely terminate an environment after a period of inactivity"는 가능성만 말함)
# - Cloud Run(두 모드): max-instances 는 "잠시 초과될 수 있다"(05:139)고 적혀 있어 쓰지 않고, CP.single_instance_config 는
#   수동 확장(05:149·194)을 쓴다. 요청 기반의 CP.cpu_after_response_config — 켜는 방법은 다른 후보(인스턴스 기반 과금)라
#   일부러 두지 않는다(없으면 A4 규칙에서 infeasible, 인스턴스 기반 후보가 따로 평가됨).
# - ECS Fargate: CP.cpu_after_response(05:334 인용은 초 단위 과금만 말함. 응답 후 CPU를 명시한 공식 문장 없음)
# - EC2: CP.max_request_seconds(05:911 '평가'. 상한 없음은 키 생략과 구별할 수 없어 둘 수 없음),
#   CP.websocket·CP.cpu_after_response(공식 문서에 명시 문장 없음, 05:912·913 ⚠️근거없음)
# - Compute Engine: CP.max_request_seconds·CP.websocket·CP.cpu_after_response(EC2와 같은 이유, 05:951~954),
#   CP.always_on·CP.scale_to_zero(인스턴스 수명 문서는 "You control the lifecycle"만 말하고 유휴 시 동작을 적지 않음)
# - SQLite: COST(01:83·119 ⚠️근거없음)

components:
  # ---------- 컴퓨트 ----------
  - id: "cp:aws/lambda/function-url"
    target: aws_lambda
    cloud: aws
    family: cp
    capabilities:
      CP.max_request_seconds:
        value: 900
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 492, url: "https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html", quote: "900 seconds (15 minutes)."}
      CP.cpu_after_response:
        value: false
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 494, url: "https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtime-environment.html", quote: "Background processes or callbacks that were initiated by your Lambda function and did not complete when the function ended resume if Lambda reuses the execution environment."}
      CP.always_on:
        value: false
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 491, url: "https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html", quote: "Lambda is designed for short-lived compute tasks that do not retain or rely upon state between invocations."}
      COST.monthly_floor_usd:
        value: 0
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 508, url: "https://aws.amazon.com/lambda/pricing/", quote: "one million requests and 400,000 GB-seconds per month"}
      CP.persistent_local_disk:
        value: false
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 509, url: "https://docs.aws.amazon.com/lambda/latest/dg/configuration-ephemeral-storage.html", quote: "This storage is temporary and unique to each execution environment."}
      # 동시 인스턴스 1개 상한일 뿐, 실행 환경은 비활성 후 종료·재활용될 수 있다(05:510 같은 줄).
      CP.single_instance_config:
        value: "예약 동시성(reserved concurrency) = 1"
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 510, url: "https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html", quote: "Reserved concurrency sets the maximum and minimum number of concurrent instances that you want to allocate to your function."}

  - id: "cp:gcp/cloud-run/request-billing"
    target: gcp_cloud_run
    cloud: gcp
    family: cp
    capabilities:
      CP.max_request_seconds:
        value: 3600
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 132, url: "https://docs.cloud.google.com/run/docs/configuring/request-timeout", quote: "set by default to 5 minutes (300 seconds) and can be extended up to 60 minutes (3600 seconds)"}
      CP.websocket:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 133, url: "https://docs.cloud.google.com/run/docs/triggering/websockets", quote: "WebSockets streams are HTTP requests, which are still subject to the request timeout configured for your Cloud Run service."}
      CP.cpu_after_response:
        value: false
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 134, url: "https://docs.cloud.google.com/run/docs/configuring/billing-settings", quote: "CPU is only allocated during request processing."}
      # 05:138(§2.1 자기 줄)은 ⚠️근거없음이라, §2.1과 값이 같다고 적힌(05:172) §2.2 줄의 container contract 인용을 쓴다.
      CP.persistent_local_disk:
        value: false
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 183, url: "https://docs.cloud.google.com/run/docs/container-contract", quote: "It is an in-memory file system"}
      CP.scale_to_zero:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 135, url: "https://docs.cloud.google.com/run/docs/about-instance-autoscaling", quote: "when a revision does not receive any traffic, by default, it is scaled to zero instances"}
      CP.always_on:
        value: false
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 131, url: "https://docs.cloud.google.com/run/docs/configuring/billing-settings", quote: "CPU is only allocated during request processing."}
      COST.monthly_floor_usd:
        value: 0
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 148, url: "https://cloud.google.com/run/pricing", quote: "Idle instances that are not minimum instances are not charged."}
      # 05:148 "min 1(1 vCPU·0.5 GiB) 유휴 상시 ≈ 월 $13.8". 인스턴스 고정(B1·B3 수동 확장)이 필요할 때 바닥 비용 대신 쓴다.
      COST.monthly_pinned_usd:
        value: 13.8
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 148, url: "https://cloud.google.com/run/pricing", quote: "Idle instances that are not minimum instances are not charged."}
      # max-instances 는 잠시 초과될 수 있어(05:139) 쓰지 않는다. 수동 확장(05:149), 트래픽 태그 전용 리비전은 두지 않는 조건.
      CP.single_instance_config:
        value: "수동 확장 --scaling=1"
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 149, url: "https://docs.cloud.google.com/run/docs/configuring/services/manual-scaling", quote: "Manual scaling lets you set a specific instance count, regardless of traffic or utilization, and without requiring redeployment."}

  - id: "cp:gcp/cloud-run/instance-billing"
    target: gcp_cloud_run
    cloud: gcp
    family: cp
    capabilities:
      CP.max_request_seconds:
        value: 3600
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 177, url: "https://docs.cloud.google.com/run/docs/configuring/request-timeout", quote: "can be extended up to 60 minutes (3600 seconds)"}
      CP.websocket:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 178, url: "https://docs.cloud.google.com/run/docs/triggering/websockets", quote: "WebSockets streams are HTTP requests, which are still subject to the request timeout"}
      CP.cpu_after_response:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 179, url: "https://docs.cloud.google.com/run/docs/configuring/billing-settings", quote: "CPU is allocated for the entire container instance lifecycle."}
      CP.persistent_local_disk:
        value: false
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 183, url: "https://docs.cloud.google.com/run/docs/container-contract", quote: "It is an in-memory file system"}
      CP.scale_to_zero:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 180, url: "https://docs.cloud.google.com/run/docs/configuring/services/gpu", quote: "Services that are set to instance-based billing can still scale to zero."}
      COST.monthly_floor_usd:
        value: 0
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 193, url: "https://cloud.google.com/run/pricing", quote: "from the time the container is started to when it is terminated, with a minimum of 1 minute"}
      # 05:193 "min 1(1 vCPU·0.5 GiB) 상시 ≈ 월 $59.9(무료 등급 전)". 인스턴스 고정(수동 확장·min-instances)이 필요할 때 쓴다.
      COST.monthly_pinned_usd:
        value: 59.9
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 193, url: "https://cloud.google.com/run/pricing", quote: "from the time the container is started to when it is terminated, with a minimum of 1 minute"}
      CP.single_instance_config:
        value: "수동 확장 --scaling=1"
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 194, url: "https://docs.cloud.google.com/run/docs/configuring/services/manual-scaling", quote: "Manual scaling lets you set a specific instance count, regardless of traffic or utilization, and without requiring redeployment."}
      CP.always_on:
        value: false
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 195, url: "https://docs.cloud.google.com/run/docs/configuring/billing-settings", quote: "can be shut down at any time"}
      # 05:176 "상시 워커는 가능하나 인스턴스가 유휴 시 언제든 종료될 수 있어 min-instances ≥1 필요"
      CP.always_on_config:
        value: "min-instances ≥ 1"
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 176, url: "https://docs.cloud.google.com/run/docs/configuring/billing-settings", quote: "allocates CPU even outside of request processing"}

  - id: "cp:aws/ecs-fargate/alb"
    target: aws_ecs_fargate
    cloud: aws
    family: cp
    capabilities:
      # 조사 문서: Fargate 자체 상한은 미확인, "실질 상한은 ALB 유휴 타임아웃 기본 60초(1~4,000초)"(05:332). 기본값을 쓴다.
      CP.max_request_seconds:
        value: 60
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 332, url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-load-balancer-attributes.html", quote: "By default, Elastic Load Balancing sets the idle timeout value for your load balancer to 60 seconds."}
      CP.websocket:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 333, url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html", quote: "Application Load Balancers provide native support for WebSockets."}
      CP.persistent_local_disk:
        value: false
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 338, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ebs-volumes.html", quote: "Volumes that are attached to tasks that are managed by a service aren't preserved and are always deleted upon task termination."}
      CP.always_on:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 349, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs_services.html", quote: "You can use an Amazon ECS service to run and maintain a specified number of instances of a task definition simultaneously in an Amazon ECS cluster."}
      # 기본 동작은 아니다(오토스케일링 최소 용량 0일 때). ALB 고정비는 남는다.
      CP.scale_to_zero:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 350, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-auto-scaling.html", quote: "If you want your task count to scale to zero when there's no work to be done, set a minimum capacity of 0."}
      # 05:351 태스크 0.25 vCPU·0.5 GB $10.36 + ALB $16.43 + 공인 IPv4 3개 $10.95 = $37.74 (LCU 제외).
      COST.monthly_floor_usd:
        value: 37.74
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 351, url: "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonECS/current/ap-northeast-2/index.json", quote: "AWS Fargate - vCPU  - Asia Pacific (Seoul)"}

  - id: "cp:aws/ec2/docker-compose"
    target: aws_ec2
    cloud: aws
    family: cp
    capabilities:
      CP.persistent_local_disk:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 917, url: "https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html", quote: "EBS volumes persist independently from the running life of an EC2 instance."}
      # 05:927 "t4g.small … + gp3 20 GB $1.82 + 공인 IPv4 $3.65 → 월 $20.7~24.5. LB·NAT 없음". 범위의 최솟값.
      COST.monthly_floor_usd:
        value: 20.7
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 927, url: "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonEC2/current/ap-northeast-2/index.csv", quote: "$0.0208 per On Demand Linux t4g.small Instance Hour"}
      CP.always_on:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 928, url: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html", quote: "that you keep the instance running, even if the instance remains idle"}
      CP.scale_to_zero:
        value: false
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 928, url: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html", quote: "that you keep the instance running, even if the instance remains idle"}
      CP.single_instance_config:
        value: "VM 1대 + compose container_name 지정"
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 929, url: "https://docs.docker.com/reference/compose-file/services/", quote: "Compose does not scale a service beyond one container if the Compose file specifies a `container_name`."}

  - id: "cp:gcp/compute-engine/docker-compose"
    target: gcp_compute_engine
    cloud: gcp
    family: cp
    capabilities:
      CP.persistent_local_disk:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 968, url: "https://docs.cloud.google.com/compute/docs/disks/persistent-disks", quote: "You can detach or move the volumes to keep your data even after you delete your instances."}
      CP.single_instance_config:
        value: "VM 1대 + compose container_name 지정"
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 969, url: "https://docs.docker.com/reference/compose-file/services/", quote: "Compose does not scale a service beyond one container if the Compose file specifies a `container_name`."}
      # 05:970 e2-small $15.69 + pd-balanced 10 GiB $1.30 + 외부 IPv4 $3.65 = $20.64.
      COST.monthly_floor_usd:
        value: 20.64
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 970, url: "https://cloud.google.com/products/compute/pricing/general-purpose", quote: "$0.02149143 / 1 hour"}

  # ---------- 저장소·캐시 ----------
  - id: "ds:aws/rds-postgres/single-az"
    cloud: aws
    family: ds
    capabilities:
      DS.engine:
        value: postgres
        source: {doc: "capabilities/01-sql-databases.md", line: 220, url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html", quote: "You can create Db2, MySQL, MariaDB, and PostgreSQL RDS DB instances with up to 64 tebibytes (TiB) of storage."}
      # 01:229 "서울 db.t4g.micro $0.025/시간 ≈ $18.25/월 + gp3 … (20GB ≈ $2.62) → 약 $20.9/월"
      COST.monthly_floor_usd:
        value: 20.9
        source: {doc: "capabilities/01-sql-databases.md", line: 229, url: "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonRDS/current/ap-northeast-2/index.json", quote: "APN2-InstanceUsage:db.t4g.micro"}

  - id: "ds:gcp/cloudsql-postgres/single"
    cloud: gcp
    family: ds
    capabilities:
      DS.engine:
        value: postgres
        source: {doc: "capabilities/01-sql-databases.md", line: 389, url: "https://docs.cloud.google.com/sql/docs/postgres/locations", quote: "https://docs.cloud.google.com/sql/docs/postgres/locations"}
      # 01:392 db-f1-micro $10.00 + SSD 10 GiB $2.21 = $12.21 (공유 코어는 SLA 대상 아님).
      COST.monthly_floor_usd:
        value: 12.21
        source: {doc: "capabilities/01-sql-databases.md", line: 392, url: "https://cloud.google.com/sql/pricing", quote: "$0.0137 / 1 hour"}

  - id: "ca:aws/elasticache/node-based"
    cloud: aws
    family: ca
    capabilities:
      DS.engine:
        value: redis
        source: {doc: "capabilities/03-cache-queue-scheduler-realtime-storage.md", line: 258, url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AutoFailover.html", quote: "Valkey and Redis OSS replication is asynchronous."}
      # 03:264 "Redis OSS $0.024/시간이면 약 $17.5/월(1노드, HA 없음)". Valkey 노드($14.0)는 엔진이 달라 쓰지 않는다.
      COST.monthly_floor_usd:
        value: 17.5
        source: {doc: "capabilities/03-cache-queue-scheduler-realtime-storage.md", line: 264, url: "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonElastiCache/current/ap-northeast-2/index.json", quote: "$0.024 per T4G Micro Cache node-hour … running Redis"}

  - id: "ca:gcp/memorystore/redis-basic"
    cloud: gcp
    family: ca
    capabilities:
      DS.engine:
        value: redis
        source: {doc: "capabilities/03-cache-queue-scheduler-realtime-storage.md", line: 348, url: "https://docs.cloud.google.com/memorystore/docs/redis/memorystore-for-redis-overview", quote: "Redis instances are protected from the internet using private IPs"}
      COST.monthly_floor_usd:
        value: 47.45
        source: {doc: "capabilities/03-cache-queue-scheduler-realtime-storage.md", line: 353, url: "https://cloud.google.com/memorystore/docs/redis/pricing", quote: "$47.45 / 1 gibibyte month"}

  - id: "ds:local/sqlite/default"
    cloud: local
    family: ds
    capabilities:
      DS.engine:
        value: sqlite
        source: {doc: "capabilities/01-sql-databases.md", line: 72, url: "https://www.sqlite.org/whentouse.html", quote: "SQLite only supports one writer at a time per database file."}

  - id: "ds:local/sqlite/wal"
    cloud: local
    family: ds
    capabilities:
      DS.engine:
        value: sqlite
        source: {doc: "capabilities/01-sql-databases.md", line: 72, url: "https://www.sqlite.org/whentouse.html", quote: "SQLite only supports one writer at a time per database file."}
