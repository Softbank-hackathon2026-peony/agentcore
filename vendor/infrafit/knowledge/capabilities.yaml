    cloud: gcp
    family: cp
    capabilities:
      # GKE Ingress(클래식 Application LB) 백엔드 타임아웃 기본값(05:612). ECS(ALB 기본 60초)와 같이 기본값을 쓴다. BackendConfig timeoutSec로 바꿀 수 있다.
