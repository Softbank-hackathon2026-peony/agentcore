        value: 30
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 612, url: "https://docs.cloud.google.com/kubernetes-engine/docs/how-to/ingress-configuration", quote: "If you do not specify a value, the default value is 30 seconds."}
      # 기본 30초보다 긴 요청은 BackendConfig timeoutSec로 늘린다(05:1013). 상한 값은 인용이 없어 "제한 없음"(A2 그 이상)에는 쓰지 않는다.
      CP.max_request_seconds_config:
        value: "BackendConfig timeoutSec"
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 1013, url: "https://docs.cloud.google.com/kubernetes-engine/docs/how-to/ingress-configuration", quote: "You can use a BackendConfig to set a backend service timeout period in seconds."}
      # 지원하지만 클래식 LB는 웹소켓을 백엔드 타임아웃(기본 30초)에 끊는다(05:613). 오래 열려면 timeoutSec 조정.
      CP.websocket:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 1000, url: "https://docs.cloud.google.com/load-balancing/docs/https/request-distribution", quote: "The WebSocket protocol is supported with GKE Ingress."}
      CP.always_on:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 1001, url: "https://docs.cloud.google.com/kubernetes-engine/docs/how-to/stateless-apps", quote: "Deployments manage the desired state of your application: how many Pods should run your application"}
      # 롤링 업데이트 중 잠시 2개가 겹칠 수 있다(기본 maxSurge 25%, 05:622).
      CP.single_instance_config:
        value: "Deployment replicas: 1 (HPA 없음)"
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 1001, url: "https://docs.cloud.google.com/kubernetes-engine/docs/how-to/stateless-apps", quote: ".spec.replicas: is the number of replicated Pods that the Deployment manages."}
      # PVC(PD)를 쓸 때. Pod 임시 스토리지는 영속하지 않고, RWO라 Deployment보다 StatefulSet(05:618, 05:1002).
      CP.persistent_local_disk:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 1002, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/persistent-volumes", quote: "PersistentVolume resources are cluster resources that exist independently of Pods."}
      # 기본 동작은 아니다(GKE 1.37+ HPA 설정). 클러스터 요금·LB 고정비는 남는다.
      CP.scale_to_zero:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 1003, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/horizontalpodautoscaler", quote: "In GKE version 1.37 or later, you can configure the horizontal Pod autoscaler to scale a workload down to 0 replicas when there is no demand"}
      CP.horizontal_scaling:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 1003, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/horizontalpodautoscaler", quote: "The horizontal Pod autoscaler changes the shape of your Kubernetes workload by automatically increasing or decreasing the number of Pods"}
      CP.multi_workload:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 1004, url: "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview", quote: "workloads in the cluster can communicate with each other and with the internet."}
      # 05:1005 요금 $73 − 무료 크레딧(첫 클러스터) = 0 + Pod 1개(0.25 vCPU·0.5 GiB·임시 1 GiB) $12.86 + Ingress 포워딩 규칙 $18.25 = $31.11.
      # 같은 결제 계정의 두 번째 클러스터면 +$73.
      COST.monthly_floor_usd:
        value: 31.11
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 1005, url: "https://cloud.google.com/kubernetes-engine/pricing", quote: "The GKE free tier provides $74.40 in monthly credits per billing account, which is equivalent to one free Autopilot or zonal Standard cluster per month."}
      # 05:1005 Pod 1개: 0.25 × $0.0571 × 730 + 0.5 × $0.0063215 × 730 + 1 × $0.0001784 × 730 = $12.86 (서울).
      COST.per_replica_usd:
        value: 12.86
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 1005, url: "https://cloud.google.com/kubernetes-engine/pricing", quote: "GKE Autopilot vCPU Price (vCPU)"}
      CP.platform_request_timeout:
        value: true
        source: {doc: "capabilities/05-compute-tier1-2.md", line: 612, url: "https://docs.cloud.google.com/kubernetes-engine/docs/how-to/ingress-configuration", quote: "If you do not specify a value, the default value is 30 seconds."}
      # post-response-work.md §4 D8
      CP.cpu_after_response:
        value: true
        source:
          basis: derived
          from: {doc: "post-response-work.md", line: 105, url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/", quote: "The kubelet also reserves at least the request amount of that system resource specifically for that container to use."}
          reasoning: "CPU는 HTTP 요청이 아니라 컨테이너 단위로 예약·제한되므로 응답 뒤 작업도 limit까지 CPU를 쓴다"
      CP.runs_long_lived_server:
        value: true
        source:
          basis: derived
          from: {doc: "capabilities/05-compute-tier1-2.md", line: 1001, url: "https://docs.cloud.google.com/kubernetes-engine/docs/how-to/stateless-apps", quote: "Deployments manage the desired state of your application: how many Pods should run your application"}
          reasoning: "Deployment가 정한 수의 Pod를 계속 실행하므로 Pod 안 서버 프로세스가 떠 있다"

