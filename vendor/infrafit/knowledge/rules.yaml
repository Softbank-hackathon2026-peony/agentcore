# 적합성 규칙(계획 2 MVP, 고정 형식). 차원 값(profile.json) × 능력 값(knowledge/capabilities.yaml).
#
# when:    {dimension: <A1~G3>, <연산자>}           연산자: equals | in
#          값은 S2 어휘(knowledge/profile_detectors.yaml `dimensions.<ID>.values`, dimensions.md의 한국어 값)만 쓴다.
#          목록 값(A1)은 원소 하나라도 맞으면, {value, kinds} 객체 값(B1·B2·E2)은 value로 비교한다.
# require: {capability: <능력 키>, <연산자>}         연산자: equals | gte | exists, 또는 {any: [...]} | {all: [...]}
#          능력 키가 capabilities.yaml에 없으면(생략) 결과는 unknown.
# otherwise: infeasible | config
#          config 이면 config_from 능력 키의 값(설정 이름)이 있을 때 feasible_with_config, 없으면 infeasible.
# config_from: otherwise=config 일 때 설정 이름을 가져올 능력 키(아니면 null)
#
# A2(요청 처리 시간)는 값마다 규칙을 둔다: 수십 초 → 상한 60초 이상, 수 분 → 600초 이상,
# 그 이상 → 요청 시간 상한이 있으면 안 된다(require {capability: CP.max_request_seconds, exists: false}:
# 상한 값이 있으면 infeasible, 키가 없으면 unknown).
#
# 인스턴스 1개 고정 규칙(B1, B3)은 "그대로는 통과하지 않고 설정으로만 통과한다"를
# require {capability: CP.single_instance_config, exists: false}로 적는다:
# 키가 없으면 unknown, 설정 이름이 있으면 require 실패 → otherwise config → feasible_with_config.

rules:
  # 응답 후 CPU(CP.cpu_after_response)는 상시 실행이 아니다: 유휴 인스턴스는 언제든 종료될 수 있다(05:195).
  # 상시 실행이 아니면 인스턴스를 붙잡아 두는 설정(CP.always_on_config, 예: min-instances ≥ 1)이 출처와 함께
  # 있을 때만 feasible_with_config. 정기 작업을 따로 다룰 출처 있는 예약 실행 능력 키가 없어 같은 규칙에 둔다.
  # A1 "일회성 실행"(실행하고 끝나는 배치·CLI)은 이 규칙에 걸리지 않는다.
  - id: CAP-ALWAYSON-001
    when: {dimension: A1, in: ["워커", "정기 작업"]}
    require: {capability: CP.always_on, equals: true}
    otherwise: config
    config_from: CP.always_on_config
    message: "상시 실행되는 워커·정기 작업이 있는데 이 플랫폼은 요청 밖에서 프로세스를 계속 실행하지 않는다"

  - id: CAP-TIMEOUT-001
    when: {dimension: A2, equals: "수십 초"}
    require: {capability: CP.max_request_seconds, gte: 60}
    otherwise: infeasible
    config_from: null
    message: "요청 처리에 수십 초가 걸리는데 이 플랫폼의 요청 시간 상한이 60초보다 짧다"

  - id: CAP-TIMEOUT-002
    when: {dimension: A2, equals: "수 분"}
    require: {capability: CP.max_request_seconds, gte: 600}
    otherwise: infeasible
    config_from: null
    message: "요청 처리에 수 분이 걸리는데 이 플랫폼의 요청 시간 상한이 600초보다 짧다"

  - id: CAP-TIMEOUT-003
    when: {dimension: A2, equals: "그 이상"}
    require: {capability: CP.max_request_seconds, exists: false}
    otherwise: infeasible
    config_from: null
    message: "요청 처리가 수 분을 넘는데 이 플랫폼에는 요청 시간 상한이 있다"

  - id: CAP-WEBSOCKET-001
    when: {dimension: A3, equals: "장시간 양방향(웹소켓)"}
    require: {capability: CP.websocket, equals: true}
    otherwise: infeasible
    config_from: null
    message: "장시간 웹소켓 연결이 필요한데 이 플랫폼은 지원하지 않는다"

  - id: CAP-BGWORK-001
    when: {dimension: A4, equals: "있음"}
    require: {capability: CP.cpu_after_response, equals: true}
    otherwise: config
    config_from: CP.cpu_after_response_config
    message: "응답 후 작업이 있는데 이 플랫폼은 응답을 보낸 뒤 CPU를 주지 않는다"

  - id: CAP-MEMSTATE-001
    when: {dimension: B1, equals: "있음"}
    require: {capability: CP.single_instance_config, exists: false}
    otherwise: config
    config_from: CP.single_instance_config
    message: "프로세스 메모리에 상태가 있어 인스턴스를 1개로 고정해야 한다"

  - id: CAP-LOCALDISK-001
    when: {dimension: B2, equals: "있음"}
    require: {capability: CP.persistent_local_disk, equals: true}
    otherwise: infeasible
    config_from: null
    message: "로컬 디스크에 상태(SQLite·업로드 파일)가 있는데 이 플랫폼의 로컬 디스크는 영속하지 않는다"

  - id: CAP-SINGLERUN-001
    when: {dimension: B3, equals: "있음"}
    require: {capability: CP.single_instance_config, exists: false}
    otherwise: config
    config_from: CP.single_instance_config
    message: "앱 안 스케줄러처럼 한 번만 실행돼야 하는 작업이 있어 인스턴스를 1개로 고정해야 한다"

  # 앱 안 스케줄러는 요청이 없을 때도 CPU가 있어야 돈다(05:128 "앱 안 스케줄러(B3)는 CPU가 없어 돌지 않는다").
  # 인스턴스 1개 고정(CAP-SINGLERUN-001)과 함께 쓰므로, 상시 실행이거나 응답 밖 CPU가 있으면 통과한다.
  - id: CAP-SINGLERUN-002
    when: {dimension: B3, equals: "있음"}
    require:
      any:
        - {capability: CP.always_on, equals: true}
        - {capability: CP.cpu_after_response, equals: true}
    otherwise: infeasible
    config_from: null
    message: "앱 안 스케줄러가 있는데 이 플랫폼은 요청이 없을 때 CPU를 주지 않아 스케줄러가 돌지 않는다"
