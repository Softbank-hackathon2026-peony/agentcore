# S2 프로필 탐지 지식(설계 §7, 계획 2 작업 2). 결정적 탐지기만: LLM 없음.
# 값 어휘는 docs/research/dimensions.md의 표를 그대로 쓴다.

# 앱 워크로드(차원을 정하는 범위). static-frontend·migration-job·reverse-proxy는 앱 요구를 정하지 않는다.
# batch: 진입점만 있고 스케줄·루프 근거가 없는 배치·CLI(실행하고 끝난다).
app_kinds: [web, worker, scheduled, realtime, batch]
# 앱 워크로드 집계 범위 ID(워크로드 ID와 겹치면 뒤에 `.all`을 붙인다)
app_scope: w-app
# 요청 경로 탐지(scope: request-path)가 핸들러 파일에서 따라가는 로컬 import 깊이
import_depth: 2
# 워크로드 코드로 보는 파일
source_globs: ["**/*.py", "**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.tsx", "**/*.jsx",
               "**/*.java", "**/*.kt"]

# 차원 정의. shape: set(값 목록, 합집합) | ordered(values 순서의 최댓값) | flag(없음/있음) |
# kinds({value: 없음|있음, kinds: [...]}, 종류 합집합). applies_to: 이 워크로드 종류에만 값을 낸다.
# default: 탐지 근거가 없을 때. source: assumption이면 assumptions[]에 reason과 함께 기록한다.
dimensions:
  # "일회성 실행"은 dimensions.md A1 표(웹 / 워커 / 정기 작업 / 실시간 연결)에 없어 여기서 더한 값이다:
  # 진입점만 있고 스케줄·루프 근거가 없는 batch 워크로드(실행하고 끝나는 배치·CLI). 상시 실행을 요구하지 않는다.
  A1:
    shape: set
    # "리버스 프록시"는 S2가 내지 않는다(프록시는 앱 워크로드가 아님). S3가 reverse-proxy 워크로드 범위에 붙인다(CAP-PROXY-001).
    values: ["웹", "워커", "정기 작업", "실시간 연결", "일회성 실행", "리버스 프록시"]
    from_kind: {web: "웹", worker: "워커", scheduled: "정기 작업", realtime: "실시간 연결", batch: "일회성 실행"}
  A2:
    shape: ordered
    values: ["1초 미만", "수십 초", "수 분", "그 이상"]
    applies_to: [web, realtime]
    default:
      value: "1초 미만"
      source: assumption
      reason: "요청 경로(핸들러와 그 로컬 import)에서 LLM 호출·무거운 동기 작업 시그니처를 찾지 못했다. 처리 시간은 코드로 잴 수 없어 짧은 요청으로 가정한다"
  A3:
    shape: ordered
    values: ["짧은 HTTP", "스트리밍(SSE)", "장시간 양방향(웹소켓)"]
    applies_to: [web, realtime]
    default: {value: "짧은 HTTP", source: detector}
  A4:
    shape: flag
    values: ["없음", "있음"]
    default: {value: "없음", source: detector}
  B1:
    shape: kinds
    values: ["없음", "있음"]
    default: {value: "없음", source: detector}
  B2:
    shape: kinds
    values: ["없음", "있음"]
    default: {value: "없음", source: detector}
  B3:
    shape: flag
    values: ["없음", "있음"]
    default: {value: "없음", source: detector}
  E2:
    shape: kinds
    values: ["없음", "있음"]
    default: {value: "없음", source: detector}
  # D2 평시 동시성(dimensions.md 어휘). 저장소가 밝힌 확장 설정(아래 scaling.D2)이 있으면 그 값, 없으면 가정 낮음
  D2:
    shape: ordered
    values: ["낮음", "중간", "높음"]
    default:
      value: "낮음"
      source: assumption
      reason: "평시 동시 접속은 코드에 없다. 레플리카·오토스케일 설정도 없고 사용자 집단·트래픽 자료가 없어 소규모(낮음)로 가정한다"
  # D3 폭증 형태(dimensions.md 어휘). 부하 테스트 스크립트가 폭증·이벤트를 직접 말할 때만 탐지(scaling.D3)
  D3:
    shape: ordered
    values: ["없음", "예고된 이벤트", "예고 없는 폭증"]
    applies_to: [web, realtime]
    default:
      value: "없음"
      source: assumption
      reason: "폭증 형태는 도메인(오픈 시각·선착순·재난)에서 정해지는데 코드·부하 테스트에 폭증을 밝힌 근거가 없어 없음으로 가정한다"
  # D6 확장 요구: dimensions.md 표에 없어 여기서 더한 차원(A1 "일회성 실행"과 같은 방식).
  # 저장소의 배포 설정이 밝힌 인스턴스 수(인벤토리 workloads[].scaling: 환경 중 최댓값)를 규칙이 비교할 값으로 옮긴다.
  #   단일 인스턴스: 레플리카 설정이 없거나 min=max=1
  #   고정 다중:     오토스케일 없이 레플리카 ≥ 2(Deployment·StatefulSet replicas, compose deploy.replicas)
  #   자동 확장:     HPA(autoscaling/*)·KEDA ScaledObject가 min < max로 확장
  # 순서(ordered)는 앱 집계에서 자동 확장 > 고정 다중 > 단일 인스턴스. 숫자(min·max)는 인벤토리 scaling에서 읽는다.
  D6:
    shape: ordered
    values: ["단일 인스턴스", "고정 다중", "자동 확장"]
    applies_to: [web, worker, realtime]
    default: {value: "단일 인스턴스", source: detector}

# 코드로 알 수 없는 값: 앱 집계 범위에 가정으로 둔다(origin: domain-default)
# (D2는 dimensions에 둔다: 워크로드마다 확장 설정으로 정하고, 없을 때만 가정)
assumptions:
  - key: G3
    value: "높음"
    reason: "예산 민감도는 코드에 없다. 고정비가 큰 구성을 피하도록 예산 민감(높음)으로 가정한다"

# 인벤토리 workloads[].scaling → 차원(profile/detectors.py _scaling_observations)
scaling:
  # D6 값: 오토스케일(autoscale) → auto, min ≥ 2 → fixed, 나머지(min=max=1 설정) → single
  D6: {auto: "자동 확장", fixed: "고정 다중", single: "단일 인스턴스"}
  # D2: 레플리카 근거(evidence)가 있고 min ≥ min_replicas 또는 autoscale이면 이 값(dimensions.md 어휘).
  # 저장소가 여러 인스턴스·자동 확장을 설정했다 = 평시 한 인스턴스로 부족한 동시성을 예상한다. 그보다 큰 값(높음)은
  # 설정 숫자만으로 정하지 않는다(코드에 사용자 수가 없다).
  D2: {value: "중간", min_replicas: 2}
  # D3: 부하 테스트 스크립트(scaling.load_tests) 본문이 폭증·이벤트를 직접 말할 때만(위에서부터 먼저 맞는 값).
  # 부하 테스트가 있다는 사실만으로는 D2·D3를 바꾸지 않는다. 엔드포인트 이름(쿠폰·티켓 API 등)과 헷갈리는 낱말은 쓰지 않는다.
  load_tests:
    - {dimension: D3, value: "예고 없는 폭증", regex: '(?i)폭증|급증|재난|속보|\bspike\b|\bsurge\b|\bdisaster\b'}
    - {dimension: D3, value: "예고된 이벤트", regex: '(?i)선착순|오픈\s*이벤트|티켓\s*오픈|\bflash[\s_-]?sale\b|\bticketing\b|\blaunch[\s_-]?event\b'}

# 앱 워크로드가 모두 batch(일회성 실행)이면 profile.batch_only.value = true(S4가 not_deployable로 낸다).
# 정적 프런트엔드가 있으면 배포할 사이트가 있으므로 아니다.
batch_only:
  reason: "사람이 실행하는 도구: 앱 워크로드가 모두 실행하고 끝나는 배치·CLI(일회성 실행)이고 상시 실행·요청 수신 진입점이 없다"

# 인벤토리 범위의 구성 요소 → 차원(component는 fnmatch 패턴, role이 있으면 그 역할의 범위만)
components:
  - {component: "ca:local/process-memory/*", role: session, dimension: B1, kind: in-memory-session}
  - {component: "ca:local/process-memory/*", role: cache, dimension: B1, kind: in-memory-cache}
  - {component: "rt:lib/socketio/no-adapter", dimension: B1, kind: websocket-rooms}
  - {component: "rt:lib/socketio/*", dimension: A3, value: "장시간 양방향(웹소켓)"}
  - {component: "ds:local/sqlite/*", dimension: B2, kind: sqlite}
  - {component: "fs:local/container-disk/*", dimension: B2, kind: local-files}
  - {component: "sc:local/in-process/*", dimension: B3, value: "있음"}

# 인벤토리 unmapped label → 차원(근거 파일의 워크로드에 붙인다)
unmapped:
  - {label: spring-stomp-simple-broker, dimension: B1, kind: websocket-broker}

# 엔드포인트 method → 차원
endpoints:
  - {method: WEBSOCKET, dimension: A3, value: "장시간 양방향(웹소켓)"}
  - {method: WEBSOCKET, dimension: A1, value: "실시간 연결"}

# 외부 서비스 kind → 차원(종류 목록에는 외부 서비스 ID를 쓴다)
external:
  - {kinds: [llm-api, payments, messaging], dimension: E2}

# 코드 탐지기. scope: handler(엔드포인트 핸들러 파일) | request-path(핸들러 + 로컬 import, import_depth까지) |
# workload(워크로드에 속한 코드 파일 전부). value(ordered·flag) 또는 kind(kinds) 하나.
# unless: 같은 파일에 이 정규식이 있으면 그 파일의 일치는 버린다. 테스트·보조 경로는 보지 않는다.
code:
  # A2: 요청 경로의 LLM 호출
  - id: PD-A2-LLM-PY
    dimension: A2
    value: "수십 초"
    scope: request-path
    glob: ["**/*.py"]
    regex: '^\s*(?:import\s+(?:openai|anthropic|google\.generativeai)\b|from\s+(?:openai|anthropic|google\.genai|google\.generativeai|langchain_openai|langchain_anthropic)\b|from\s+google\s+import\s+(?:genai|generativeai)\b)|\.(?:chat\.completions|messages|responses)\.create\(|\.generate_content(?:_stream)?\('
  - id: PD-A2-LLM-JS
    dimension: A2
    value: "수십 초"
    scope: request-path
    glob: ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.tsx", "**/*.jsx"]
    regex: '(?:from\s+|require\(\s*)["''](?:openai|@anthropic-ai/sdk|@google/genai|@google/generative-ai|@ai-sdk/[\w-]+)["'']'
  - id: PD-A2-LLM-JVM
    dimension: A2
    value: "수십 초"
    scope: request-path
    glob: ["**/*.java", "**/*.kt"]
    regex: '^\s*import\s+(?:com\.openai|com\.anthropic|com\.google\.genai|org\.springframework\.ai)\.'
  - id: PD-A2-LLM-URL
    dimension: A2
    value: "수십 초"
    scope: request-path
    glob: ["**/*.py", "**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.tsx", "**/*.jsx", "**/*.java", "**/*.kt"]
    regex: 'api\.openai\.com|api\.anthropic\.com|generativelanguage\.googleapis\.com'
  # A2: 요청 경로의 무거운 동기 작업(엑셀·PDF 생성, 브라우저 구동, 영상 변환)
  - id: PD-A2-LONG-JS
    dimension: A2
    value: "수십 초"
    scope: request-path
    glob: ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.tsx", "**/*.jsx"]
    regex: 'new\s+ExcelJS\.Workbook\(|\bXLSX\.write(?:File)?\(|\bpuppeteer\.launch\(|\bchromium\.launch\(|new\s+PDFDocument\(|\bffmpeg\('
  - id: PD-A2-LONG-PY
    dimension: A2
    value: "수십 초"
    scope: request-path
    glob: ["**/*.py"]
    regex: '\bopenpyxl\.Workbook\(|\bxlsxwriter\.Workbook\(|\.to_excel\(|\.write_pdf\(|\bpdfkit\.from_(?:url|string|file)\(|\b(?:sync|async)_playwright\(|\bffmpeg\.'
  - id: PD-A2-LONG-JVM
    dimension: A2
    value: "수십 초"
    scope: request-path
    glob: ["**/*.java", "**/*.kt"]
    regex: '\b(?:XSSFWorkbook|SXSSFWorkbook|HSSFWorkbook)\('
  # A2: 요청 경로의 긴 동기 대기(10초 이상 상수). 변수 인자는 잡지 않는다
  - id: PD-A2-SLEEP-PY
    dimension: A2
    value: "수십 초"
    scope: request-path
    glob: ["**/*.py"]
    regex: '(?:\btime\.|\basyncio\.|(?<![\w.]))sleep\(\s*[1-9]\d+(?:\.\d+)?\s*\)'
  - id: PD-A2-SLEEP-JS
    dimension: A2
    value: "수십 초"
    scope: request-path
    glob: ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.tsx", "**/*.jsx"]
    regex: '\bsetTimeout\([^,]*,\s*[1-9]\d{4,}\s*\)|\b(?:sleep|delay)\(\s*[1-9]\d{4,}\s*\)'
  # A3: SSE 응답
  - id: PD-A3-SSE
    dimension: A3
    value: "스트리밍(SSE)"
    scope: request-path
    glob: ["**/*.py", "**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.tsx", "**/*.jsx", "**/*.java", "**/*.kt"]
    regex: 'text/event-stream|\bEventSourceResponse\(|\bSseEmitter\b|\bServerSentEvent\b|TEXT_EVENT_STREAM'
  # A4: 응답 후 작업
  - id: PD-A4-FASTAPI-BG
    dimension: A4
    value: "있음"
    scope: workload
    glob: ["**/*.py"]
    regex: '\bBackgroundTasks\b|\bbackground_tasks\.add_task\('
  - id: PD-A4-PY-TASK
    dimension: A4
    value: "있음"
    scope: workload
    glob: ["**/*.py"]
    regex: '\basyncio\.(?:create_task|ensure_future)\(|\bloop\.create_task\(|\bthreading\.Thread\(|^\s*from\s+threading\s+import\s+.*\bThread\b'
  # @Async는 붙은 메서드를 다른 파일(테스트 제외)에서 부를 때만 근거다(call_site_outside_file). 같은 클래스 안 호출은
  # 스프링 프록시를 거치지 않아 비동기로 돌지 않고, 부르는 곳이 없으면 응답 후 작업이 아니다.
  - id: PD-A4-SPRING-ASYNC
    dimension: A4
    value: "있음"
    scope: workload
    glob: ["**/*.java", "**/*.kt"]
    regex: '^\s*@(?:org\.springframework\.scheduling\.annotation\.)?Async\b'
    call_site_outside_file: true
  - id: PD-A4-JVM-RUNASYNC
    dimension: A4
    value: "있음"
    scope: workload
    glob: ["**/*.java", "**/*.kt"]
    regex: '\bCompletableFuture\.runAsync\('
  # Node: 응답 전에 await하지 않는 Promise(문장 첫머리 호출), 응답 뒤 실행 API
  - id: PD-A4-NODE-UNAWAITED
    dimension: A4
    value: "있음"
    scope: handler
    glob: ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.tsx", "**/*.jsx"]
    regex: '^\s*[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*\.sendMail\(|^\s*void\s+[A-Za-z_$][\w$.]*\(|^\s*(?!await\b|return\b)[A-Za-z_$][\w$.]*\(.*\)\.(?:then|catch)\(|\bsetImmediate\(|\bwaitUntil\(|import\s*\{[^}]*\bafter\b[^}]*\}\s*from\s*["'']next/server["'']'
  # B1: 프로세스 메모리 상태
  - id: PD-B1-RATELIMIT-EXPRESS
    dimension: B1
    kind: in-memory-rate-limit
    scope: workload
    glob: ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts"]
    regex: '\brateLimit\(\s*\{'
    unless: '\bstore\s*:'
  - id: PD-B1-RATELIMIT-SLOWAPI
    dimension: B1
    kind: in-memory-rate-limit
    scope: workload
    glob: ["**/*.py"]
    regex: '\bLimiter\(\s*key_func'
    unless: '\bstorage_uri\s*='
  - id: PD-B1-MEMORYSTORE
    dimension: B1
    kind: in-memory-session
    scope: workload
    glob: ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts"]
    regex: 'new\s+(?:session\.)?MemoryStore\('
  - id: PD-B1-MEMCACHE
    dimension: B1
    kind: in-memory-cache
    scope: workload
    glob: ["**/*.py", "**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts"]
    regex: '\bTTLCache\(|new\s+NodeCache\(|new\s+LRUCache\('
  # B3: 앱 프로세스 안의 스케줄러
  - id: PD-B3-SPRING-SCHEDULED
    dimension: B3
    value: "있음"
    scope: workload
    glob: ["**/*.java", "**/*.kt"]
    regex: '^\s*@Scheduled\b'
  - id: PD-B3-PY-SCHEDULER
    dimension: B3
    value: "있음"
    scope: workload
    glob: ["**/*.py"]
    regex: '\b(?:BackgroundScheduler|AsyncIOScheduler|BlockingScheduler)\(|\bschedule\.every\('
  - id: PD-B3-NODE-CRON
    dimension: B3
    value: "있음"
    scope: workload
    glob: ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.ts"]
    regex: '\bcron\.schedule\(|new\s+CronJob\(|\bschedule\.scheduleJob\(|^\s*@Cron\('
