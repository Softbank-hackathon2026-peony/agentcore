# 비밀값 판정(배포 단위 deploy_units의 env). 키 이름이 key 정규식(대소문자 무시)에 맞거나 값이 value 정규식에
# 맞으면 값을 내보내지 않고 이름만 env_names에 남긴다.
# key와 value의 앞 7개는 agentcore agent/analyze.py의 SECRETISH·SECRET_VALUE와 같은 규칙이다(두 곳의 판정이 같아야 한다).
key:
  - "KEY|SECRET|TOKEN|PASSWORD|PASSWD|CREDENTIAL|PRIVATE|DSN|DATABASE_URL"
value:
  - "AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}"
  - "\\bsk-[A-Za-z0-9_\\-]{16,}"
  - "\\bgh[pousr]_[A-Za-z0-9]{20,}"
  - "\\bxox[abposr]-"
  - "-----BEGIN [A-Z ]*PRIVATE KEY"
  - "\\bAIza[0-9A-Za-z_\\-]{30,}"
  # 사용자 정보에 비밀번호가 든 접속 URL(`postgres://app:app@db:5432/app`, `redis://:pw@redis:6379`)
  - "://[^/\\s:@]*:[^/\\s@]+@"
